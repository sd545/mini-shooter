<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>枪战小游戏</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0f1420; }
  canvas { display: block; cursor: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W = 0, H = 0;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const keys = Object.create(null);
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
  if (state !== 'playing' && (k === ' ' || k === 'enter')) startGame();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  mouse.down = false;
});

const mouse = { x: W / 2, y: H / 2, down: false };
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', () => {
  mouse.down = true;
  if (state !== 'playing') startGame();
});
window.addEventListener('mouseup', () => { mouse.down = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

let state = 'menu';
let player, bullets, enemies, particles, pickups, texts;
let score, wave, waveKills, spawnTimer, fireTimer, shake, time;
let best = Number(localStorage.getItem('mini-shooter-best') || 0);

function startGame() {
  state = 'playing';
  player = { x: W / 2, y: H / 2, r: 14, hp: 100, maxHp: 100, speed: 270, angle: 0, invuln: 0 };
  bullets = [];
  enemies = [];
  particles = [];
  pickups = [];
  texts = [];
  score = 0;
  wave = 1;
  waveKills = 0;
  spawnTimer = 0.6;
  fireTimer = 0;
  shake = 0;
  time = 0;
}

const killsNeeded = () => 8 + wave * 4;

function spawnEnemy() {
  const edge = Math.floor(rand(0, 4));
  let x, y;
  if (edge === 0) { x = rand(0, W); y = -30; }
  else if (edge === 1) { x = W + 30; y = rand(0, H); }
  else if (edge === 2) { x = rand(0, W); y = H + 30; }
  else { x = -30; y = rand(0, H); }

  const roll = Math.random();
  let e;
  if (wave >= 3 && roll < 0.15) {
    e = { type: 'tank', r: 26, hp: 8 + wave * 2, speed: 52 + wave * 2, color: '#c9184a', dmg: 20, score: 30 };
  } else if (wave >= 2 && roll < 0.45) {
    e = { type: 'fast', r: 11, hp: 2, speed: 165 + wave * 5, color: '#f78c6b', dmg: 8, score: 15 };
  } else {
    e = { type: 'grunt', r: 16, hp: 3 + Math.floor(wave / 2), speed: 92 + wave * 4, color: '#ef476f', dmg: 12, score: 10 };
  }
  e.x = x;
  e.y = y;
  e.maxHp = e.hp;
  e.flash = 0;
  enemies.push(e);
}

function spawnParticle(x, y, color, size, life, speed) {
  const a = rand(0, TAU);
  const v = rand(speed * 0.3, speed);
  particles.push({
    x, y,
    vx: Math.cos(a) * v,
    vy: Math.sin(a) * v,
    life, maxLife: life,
    color,
    size: rand(size * 0.6, size * 1.4),
  });
}

function explode(x, y, color, n, size) {
  for (let i = 0; i < n; i++) spawnParticle(x, y, color, size, rand(0.25, 0.6), 260);
}

function killEnemy(idx) {
  const e = enemies[idx];
  enemies.splice(idx, 1);
  score += e.score;
  waveKills++;
  explode(e.x, e.y, e.color, 14, 3);
  texts.push({ x: e.x, y: e.y - 12, str: '+' + e.score, life: 0.7, color: '#ffffff', size: 15 });
  if (Math.random() < 0.12) {
    pickups.push({ x: e.x, y: e.y, r: 10, heal: 25, life: 9 });
  }
}

function gameOver() {
  state = 'over';
  mouse.down = false;
  explode(player.x, player.y, '#4cc9f0', 40, 4);
  shake = 18;
  if (score > best) {
    best = score;
    localStorage.setItem('mini-shooter-best', String(best));
  }
}

function update(dt) {
  time += dt;

  const mx = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
  const my = (keys['s'] || keys['arrowdown'] ? 1 : 0) - (keys['w'] || keys['arrowup'] ? 1 : 0);
  if (mx || my) {
    const len = Math.hypot(mx, my);
    player.x += (mx / len) * player.speed * dt;
    player.y += (my / len) * player.speed * dt;
  }
  player.x = clamp(player.x, player.r, W - player.r);
  player.y = clamp(player.y, player.r, H - player.r);
  player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
  player.invuln = Math.max(0, player.invuln - dt);

  fireTimer -= dt;
  if (mouse.down && fireTimer <= 0) {
    fireTimer = 0.13;
    const a = player.angle + rand(-0.04, 0.04);
    const bx = player.x + Math.cos(player.angle) * (player.r + 10);
    const by = player.y + Math.sin(player.angle) * (player.r + 10);
    bullets.push({ x: bx, y: by, vx: Math.cos(a) * 560, vy: Math.sin(a) * 560, r: 4 });
    for (let i = 0; i < 3; i++) spawnParticle(bx, by, '#ffd166', 1.6, 0.1, 140);
    shake = Math.min(shake + 0.5, 5);
  }

  spawnTimer -= dt;
  if (spawnTimer <= 0 && enemies.length < 60) {
    spawnTimer = Math.max(0.25, 1.4 - wave * 0.12 - time * 0.004);
    spawnEnemy();
  }

  for (const e of enemies) {
    const a = Math.atan2(player.y - e.y, player.x - e.x);
    e.x += Math.cos(a) * e.speed * dt;
    e.y += Math.sin(a) * e.speed * dt;
    e.flash = Math.max(0, e.flash - dt);
  }
  for (let i = 0; i < enemies.length; i++) {
    for (let j = i + 1; j < enemies.length; j++) {
      const a = enemies[i], b = enemies[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 0.001;
      const min = a.r + b.r;
      if (d < min) {
        const push = (min - d) / 2;
        const nx = dx / d, ny = dy / d;
        a.x -= nx * push; a.y -= ny * push;
        b.x += nx * push; b.y += ny * push;
      }
    }
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
      bullets.splice(i, 1);
      continue;
    }
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      const rr = b.r + e.r;
      const dx = b.x - e.x, dy = b.y - e.y;
      if (dx * dx + dy * dy < rr * rr) {
        bullets.splice(i, 1);
        e.hp -= 1;
        e.flash = 0.09;
        e.x += b.vx * 0.004;
        e.y += b.vy * 0.004;
        explode(b.x, b.y, '#ffd166', 3, 1.5);
        if (e.hp <= 0) killEnemy(j);
        break;
      }
    }
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const rr = e.r + player.r;
    const dx = e.x - player.x, dy = e.y - player.y;
    if (dx * dx + dy * dy < rr * rr && player.invuln <= 0) {
      player.hp -= e.dmg;
      player.invuln = 0.6;
      shake = 12;
      explode(player.x, player.y, '#ff6b6b', 12, 3);
      const d = Math.hypot(dx, dy) || 1;
      e.x += (dx / d) * 30;
      e.y += (dy / d) * 30;
      if (player.hp <= 0) {
        gameOver();
        return;
      }
    }
  }

  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.life -= dt;
    if (p.life <= 0) {
      pickups.splice(i, 1);
      continue;
    }
    const rr = p.r + player.r + 4;
    const dx = p.x - player.x, dy = p.y - player.y;
    if (dx * dx + dy * dy < rr * rr) {
      pickups.splice(i, 1);
      player.hp = Math.min(player.maxHp, player.hp + p.heal);
      texts.push({ x: player.x, y: player.y - 22, str: '+' + p.heal + ' HP', life: 0.8, color: '#6ee27a', size: 16 });
      explode(p.x, p.y, '#6ee27a', 10, 2);
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.92;
    p.vy *= 0.92;
  }

  for (let i = texts.length - 1; i >= 0; i--) {
    const t = texts[i];
    t.life -= dt;
    t.y -= 30 * dt;
    if (t.life <= 0) texts.splice(i, 1);
  }

  if (waveKills >= killsNeeded()) {
    wave++;
    waveKills = 0;
    texts.push({ x: W / 2, y: H / 2 - 80, str: '第 ' + wave + ' 波', life: 1.8, color: '#ffd166', size: 44 });
  }

  shake = Math.max(0, shake - dt * 22);
}

function drawGrid() {
  ctx.strokeStyle = 'rgba(255,255,255,0.045)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 48) {
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
  }
  for (let y = 0; y <= H; y += 48) {
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
  }
  ctx.stroke();
}

function drawWorld() {
  ctx.fillStyle = '#0f1420';
  ctx.fillRect(0, 0, W, H);
  drawGrid();

  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));

  for (const p of pickups) {
    if (p.life < 3 && Math.floor(p.life * 6) % 2 === 0) continue;
    ctx.fillStyle = 'rgba(110,226,122,0.18)';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r + 5, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#2b8a3e';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(p.x - 2, p.y - 6, 4, 12);
    ctx.fillRect(p.x - 6, p.y - 2, 12, 4);
  }

  for (const b of bullets) {
    ctx.fillStyle = 'rgba(255,209,102,0.3)';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r + 3, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#ffd166';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.fill();
  }

  for (const e of enemies) {
    ctx.fillStyle = e.color;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 2;
    ctx.stroke();
    if (e.flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (e.flash / 0.09) * 0.8 + ')';
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, TAU);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r * 0.45, 0, TAU);
    ctx.fill();
    if (e.hp < e.maxHp) {
      const w = e.r * 2;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(e.x - e.r, e.y - e.r - 9, w, 4);
      ctx.fillStyle = '#6ee27a';
      ctx.fillRect(e.x - e.r, e.y - e.r - 9, w * (e.hp / e.maxHp), 4);
    }
  }

  if (state !== 'over') {
    const blink = player.invuln > 0 && Math.floor(player.invuln * 12) % 2 === 0;
    if (!blink) {
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.angle);
      ctx.fillStyle = '#dee2e6';
      ctx.fillRect(player.r - 2, -3, 18, 6);
      ctx.restore();

      ctx.fillStyle = '#4cc9f0';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.r, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.7)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  for (const p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const t of texts) {
    ctx.globalAlpha = clamp(t.life, 0, 1);
    ctx.fillStyle = t.color;
    ctx.font = 'bold ' + t.size + 'px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(t.str, t.x, t.y);
  }
  ctx.globalAlpha = 1;

  ctx.restore();
}

function drawHud() {
  const ratio = clamp(player.hp / player.maxHp, 0, 1);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(16, 16, 224, 22);
  ctx.fillStyle = ratio > 0.5 ? '#6ee27a' : ratio > 0.25 ? '#f0c05e' : '#e05656';
  ctx.fillRect(18, 18, 220 * ratio, 18);
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1;
  ctx.strokeRect(16, 16, 224, 22);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 13px "Segoe UI", sans-serif';
  
  ctx.textAlign = 'left';
  ctx.fillText('HP ' + Math.max(0, Math.ceil(player.hp)), 22, 32);

  ctx.textAlign = 'center';
  ctx.font = 'bold 18px "Segoe UI", sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText('第 ' + wave + ' 波', W / 2, 32);
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(W / 2 - 80, 40, 160, 4);
  ctx.fillStyle = '#ffd166';
  ctx.fillRect(W / 2 - 80, 40, 160 * (waveKills / killsNeeded()), 4);

  ctx.textAlign = 'right';
  ctx.font = 'bold 20px "Segoe UI", sans-serif';
  ctx.fillStyle = '#ffd166';
  ctx.fillText('得分 ' + score, W - 20, 32);
  ctx.font = '14px "Segoe UI", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.fillText('最高 ' + best, W - 20, 54);
}

function drawCrosshair() {
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(mouse.x, mouse.y, 9, 0, TAU);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(mouse.x - 14, mouse.y);
  ctx.lineTo(mouse.x - 5, mouse.y);
  ctx.moveTo(mouse.x + 5, mouse.y);
  ctx.lineTo(mouse.x + 14, mouse.y);
  ctx.moveTo(mouse.x, mouse.y - 14);
  ctx.lineTo(mouse.x, mouse.y - 5);
  ctx.moveTo(mouse.x, mouse.y + 5);
  ctx.lineTo(mouse.x, mouse.y + 14);
  ctx.stroke();
}

function drawOverlay(title, lines, hint) {
  ctx.fillStyle = 'rgba(8,10,16,0.72)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 56px "Segoe UI", sans-serif';
  ctx.fillText(title, W / 2, H / 2 - 80);
  ctx.font = '18px "Segoe UI", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  lines.forEach((line, i) => ctx.fillText(line, W / 2, H / 2 - 20 + i * 30));
  ctx.font = 'bold 20px "Segoe UI", sans-serif';
  ctx.fillStyle = Math.floor(performance.now() / 500) % 2 === 0 ? '#ffd166' : 'rgba(255,209,102,0.4)';
  ctx.fillText(hint, W / 2, H / 2 + 90);
}

function draw() {
  drawWorld();
  if (state === 'playing') drawHud();
  if (state === 'menu') {
    drawOverlay('枪战小游戏', [
      'WASD 或 方向键 移动',
      '鼠标瞄准 · 按住左键射击',
      '击杀敌人得分，捡起绿色医疗包回血',
    ], '点击鼠标 或 按空格 开始');
  } else if (state === 'over') {
    drawHud();
    drawOverlay('游戏结束', [
      '本局得分：' + score + '（最高分 ' + best + '）',
      '存活到第 ' + wave + ' 波',
    ], '点击鼠标 或 按空格 重新开始');
  }
  drawCrosshair();
}

startGame();
state = 'menu';

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.033);
  last = now;
  if (state === 'playing') update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
